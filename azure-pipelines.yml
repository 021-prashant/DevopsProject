
# Node.js CI Pipeline

trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Install Node.js'

  - script: |
      node --version
      npm --version
      npm ci
    displayName: 'Install dependencies'

  - script: |
      npm test
    displayName: 'Run tests'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
