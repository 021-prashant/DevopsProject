name: Node CI

on:
  push:
    branches:
      - main

jobs:
  node-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Node version
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Build Docker image
        run: docker build -t devops-node-app . 